name: Bridge Readiness Verify

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bridge-readiness-verify.yml'
      - 'services/bridge_readiness/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridge-readiness-verify.yml'
      - 'services/bridge_readiness/**'

permissions:
  contents: read

jobs:
  bridge-readiness-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/bridge_readiness/requirements.txt
      - name: Install pilot dependencies
        run: python -m pip install -r services/bridge_readiness/requirements.txt
      - name: Verify read-only readiness behavior
        run: python -B -m unittest discover -s services/bridge_readiness -p 'test_*.py' -v
