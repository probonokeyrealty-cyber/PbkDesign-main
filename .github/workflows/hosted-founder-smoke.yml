name: Hosted Founder Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-founder-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify smoke isolation boundaries
        run: npm run test:hosted-isolation

      - name: Run disposable sample bridge smoke
        run: npm run test:hosted

      - name: Build frontend assets
        run: npm run build

      - name: Install isolated proof browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run sample-only desktop and mobile proof
        run: npm run test:hosted-browser
