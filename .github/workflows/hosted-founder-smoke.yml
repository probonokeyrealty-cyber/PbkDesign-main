name: Hosted Founder Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-founder-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PBK_BRIDGE_API_KEY: ${{ secrets.PBK_BRIDGE_API_KEY }}
      PBK_HOSTED_BRIDGE_URL: ${{ secrets.PBK_HOSTED_BRIDGE_URL }}

    steps:
      - name: Check hosted smoke secrets
        id: hosted-secrets
        shell: bash
        run: |
          if [ -z "$PBK_BRIDGE_API_KEY" ]; then
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "PBK_BRIDGE_API_KEY is not configured; skipping hosted smoke."
          else
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: ${{ steps.hosted-secrets.outputs.run_smoke == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ steps.hosted-secrets.outputs.run_smoke == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Render and Netlify
        if: ${{ steps.hosted-secrets.outputs.run_smoke == 'true' }}
        run: sleep 120

      - name: Run hosted founder smoke
        if: ${{ steps.hosted-secrets.outputs.run_smoke == 'true' }}
        shell: bash
        env:
          HOSTED_SMOKE_ATTEMPTS: 4
          HOSTED_SMOKE_RETRY_SECONDS: 60
        run: |
          set +e
          for attempt in $(seq 1 "$HOSTED_SMOKE_ATTEMPTS"); do
            echo "::group::Hosted founder smoke attempt ${attempt}/${HOSTED_SMOKE_ATTEMPTS}"
            node ./scripts/openclaw-hosted-smoke.mjs
            status=$?
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -eq "$HOSTED_SMOKE_ATTEMPTS" ]; then
              echo "Hosted founder smoke failed after ${HOSTED_SMOKE_ATTEMPTS} attempts."
              exit "$status"
            fi

            echo "Hosted founder smoke failed with exit ${status}; retrying in ${HOSTED_SMOKE_RETRY_SECONDS}s."
            sleep "$HOSTED_SMOKE_RETRY_SECONDS"
          done
