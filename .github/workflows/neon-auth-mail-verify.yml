name: Neon Auth Mail Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify signatures, isolation, delivery claims, and packaging
        run: node --test scripts/neon-auth-mail.node-test.mjs scripts/neon-auth-microsoft.node-test.mjs
