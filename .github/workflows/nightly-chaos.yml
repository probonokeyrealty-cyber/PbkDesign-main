name: Nightly Engineering Rigor

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos-and-coworker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run safety and chaos checks
        run: |
          npm run test:safety-validator
          npm run test:chaos

      - name: Run coworker UX checks
        run: |
          npm run test:coworker-heartbeat
          npm run test:slack-mention-router
