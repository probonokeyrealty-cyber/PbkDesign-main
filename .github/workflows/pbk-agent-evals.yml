name: PBK Agent Evals

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pbk-agent-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY || secrets.PBK_NEON_API_KEY }}
      PBK_NEON_API_KEY: ${{ secrets.PBK_NEON_API_KEY || secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || secrets.PBK_NEON_PROJECT_ID || vars.NEON_PROJECT_ID || vars.PBK_NEON_PROJECT_ID }}
      PBK_NEON_PROJECT_ID: ${{ secrets.PBK_NEON_PROJECT_ID || secrets.NEON_PROJECT_ID || vars.PBK_NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Neon eval secrets
        shell: bash
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "NEON_API_KEY or PBK_NEON_API_KEY is required for disposable Neon evals."
            exit 1
          fi
          if [ -z "$NEON_PROJECT_ID" ]; then
            echo "NEON_PROJECT_ID or PBK_NEON_PROJECT_ID is required for disposable Neon evals."
            exit 1
          fi

      - name: Validate Neon evaluation harness
        run: npm run test:neon-evaluation-harness

      - name: Run AVA eval suite on disposable Neon branch
        run: npm run neon:evaluation -- --ttl-hours 1 -- npm run test:ava-eval-suite
