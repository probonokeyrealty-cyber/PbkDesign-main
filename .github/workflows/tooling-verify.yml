name: Tooling Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Install dependencies with retry
        shell: bash
        env:
          NPM_INSTALL_ATTEMPTS: 3
          NPM_INSTALL_RETRY_SECONDS: 10
        run: |
          set -euo pipefail

          npm_ci_with_retry() {
            local label="$1"
            shift
            local attempt output status

            for attempt in $(seq 1 "$NPM_INSTALL_ATTEMPTS"); do
              echo "::group::${label} (attempt ${attempt}/${NPM_INSTALL_ATTEMPTS})"
              if output=$("$@" 2>&1); then
                status=0
              else
                status=$?
              fi
              printf '%s\n' "$output"
              echo "::endgroup::"

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if ! grep -Eqi 'ECONNRESET|ETIMEDOUT|ENETUNREACH|ECONNREFUSED|EAI_AGAIN|socket hang up|network timeout' <<< "$output"; then
                echo "::error::${label} failed with a non-transient npm error; not retrying."
                return "$status"
              fi

              if [ "$attempt" -eq "$NPM_INSTALL_ATTEMPTS" ]; then
                echo "::error::${label} failed after ${NPM_INSTALL_ATTEMPTS} transient network attempts."
                return "$status"
              fi

              echo "::warning::${label} hit a transient npm network error; retrying in ${NPM_INSTALL_RETRY_SECONDS}s."
              sleep "$NPM_INSTALL_RETRY_SECONDS"
            done
          }

          npm_ci_with_retry "root dependencies" npm ci
          npm_ci_with_retry "MCP server dependencies" npm ci --prefix ./mcp-server

      - name: Run tooling gate
        run: npm run test:tooling
