[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[functions.documents-pdf]
timeout = 26
included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[functions.public-ava-chat]
timeout = 15

[functions.pbk-bridge-proxy]
timeout = 25

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.onrender.com wss://*.onrender.com; frame-ancestors 'none'"

[[redirects]]
from = "/api/documents/pdf"
to = "/.netlify/functions/documents-pdf"
status = 200
force = true

[[redirects]]
from = "/index.shell.html/*"
to = "/index.shell.html"
status = 200
force = true

[[redirects]]
from = "/"
to = "/index.shell.html"
status = 200
force = true

[[redirects]]
from = "/health"
to = "/.netlify/functions/pbk-bridge-proxy?path=/health"
status = 200
force = true

[[redirects]]
from = "/status"
to = "/.netlify/functions/pbk-bridge-proxy?path=/status"
status = 200
force = true

[[redirects]]
from = "/state"
to = "/.netlify/functions/pbk-bridge-proxy?path=/state"
status = 200
force = true

[[redirects]]
from = "/events"
to = "/.netlify/functions/pbk-bridge-proxy?path=/events"
status = 200
force = true

[[redirects]]
from = "/invoke"
to = "/.netlify/functions/pbk-bridge-proxy?path=/invoke"
status = 200
force = true

[[redirects]]
from = "/metrics"
to = "/.netlify/functions/pbk-bridge-proxy?path=/metrics"
status = 200
force = true

[[redirects]]
from = "/brain"
to = "/index.html"
status = 200

[[redirects]]
from = "/brain/*"
to = "/.netlify/functions/pbk-bridge-proxy?path=/brain/:splat"
status = 200
force = true

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/pbk-bridge-proxy?path=/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
