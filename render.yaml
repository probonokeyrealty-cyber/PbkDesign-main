services:
  - type: web
    name: pbk-openclaw-bridge
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile.openclaw
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PBK_OPENCLAW_STATE_DIR
        value: /app/.pbk-local

      # ── Core auth + state ───────────────────────────────────────────────
      # Bearer token required on POST endpoints. Same value goes into the PBK
      # Settings -> OpenClaw API key field and into the n8n 'PBK Bridge Bearer'
      # credential.
      - key: PBK_BRIDGE_API_KEY
        sync: false
      # Dedicated outbound Desktop Sidecar WebSocket token. Use a separate
      # secret from PBK_BRIDGE_API_KEY so local desktop access can be rotated
      # without changing dashboard/API auth.
      - key: PBK_SIDECAR_TOKEN
        sync: false
      # Postgres connection string. Use Render's "Add From Database" pattern
      # against the pbk-openclaw-db service so this is wired automatically.
      - key: PBK_DATABASE_URL
        sync: false
      # Public base URL of THIS service. Used to build provider webhook URLs
      # (Telnyx call events, DocuSign envelope status, etc.) that point back here.
      - key: PBK_PUBLIC_BASE_URL
        value: https://pbk-openclaw-bridge.onrender.com
      # Optional shared state for multi-instance readiness. Set this to a
      # Render Key Value / Redis URL before raising numInstances above 1.
      - key: PBK_REDIS_URL
        fromService:
          type: keyvalue
          name: pbk-openclaw-redis
          property: connectionString
      - key: PBK_REDIS_NAMESPACE
        value: pbk-openclaw
      - key: PBK_REDIS_CALL_STATE_TTL_SECONDS
        value: "21600"

      # OpenTelemetry/Grafana observability. Keep OTLP endpoint/headers secret
      # in Render; bridge runs fail-open if not configured.
      - key: PBK_OBSERVABILITY_ENABLED
        value: "true"
      - key: PBK_OBSERVABILITY_SERVICE_NAME
        value: pbk-openclaw-bridge
      - key: OTEL_SERVICE_NAME
        value: pbk-openclaw-bridge
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: PBK_OBSERVABILITY_ALERTS_ENABLED
        value: "true"
      - key: PBK_OBSERVABILITY_SLACK_WEBHOOK_URL
        sync: false

      # Optional AWS S3 cold archive for Ava/Rex long-term call memory.
      # Supabase Storage remains the active playback store; S3 keeps private
      # raw audio for model training, audits, and future memory pipelines.
      - key: PBK_S3_RECORDING_ARCHIVE_ENABLED
        value: "true"
      - key: PBK_S3_RECORDINGS_BUCKET
        value: pbk-ava-recordings-679432970378-us-east-2
      - key: PBK_S3_RECORDINGS_PREFIX
        value: recordings
      - key: PBK_AWS_REGION
        value: us-east-2
      - key: PBK_AWS_ACCESS_KEY_ID
        sync: false
      - key: PBK_AWS_SECRET_ACCESS_KEY
        sync: false

      # OpenAI Responses API web search for Rex/Ava current-market research.
      # Optional proxy route: set PBK_OPENAI_BASE_URL to a compatible LiteLLM
      # or OpenAI-compatible proxy that supports /v1/responses + web_search.
      - key: PBK_OPENAI_API_KEY
        sync: false
      - key: PBK_OPENAI_BASE_URL
        sync: false
      - key: PBK_OPENAI_WEB_SEARCH_ENABLED
        value: "true"
      - key: PBK_OPENAI_WEB_SEARCH_MODEL
        value: gpt-4o-mini
      # Tavily live web search for Ava/Rex. Keep the real value in Render's
      # protected environment UI; never commit it to this blueprint.
      - key: PBK_TAVILY_API_KEY
        sync: false

      # DeepSeek strategist lane for Ava/Rex coaching. This is advisory:
      # provider writes, offer increases, contracts, calls, and SMS remain
      # approval-gated by the PBK bridge.
      - key: PBK_DEEPSEEK_API_KEY
        sync: false
      - key: PBK_DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: PBK_DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: PBK_DEEPSEEK_FALLBACK_MODEL
        value: deepseek-v4-flash
      - key: PBK_STRATEGIST_PROVIDER
        value: deepseek

      # Hermes analyst lane. Keep this suggest-only: Hermes can recommend
      # scripts/strategy from PBK data, but provider writes remain approval-gated.
      - key: PBK_HERMES_ENABLED
        value: "true"
      - key: PBK_HERMES_SUGGEST_ONLY
        value: "true"
      - key: PBK_HERMES_GATEWAY_URL
        sync: false
      - key: PBK_HERMES_API_KEY
        sync: false
      - key: PBK_HERMES_WEBHOOK_URL
        sync: false
      - key: PBK_HERMES_SLACK_CHANNEL
        value: "#hermes-insights"
      - key: PBK_HERMES_TIMEOUT_MS
        value: "8000"

      # Public website Ava chat. This route is read-only except lead capture:
      # no calls, SMS, email, contracts, deletes, or admin tool execution.
      - key: PBK_PUBLIC_AVA_CHAT_ENABLED
        value: "true"
      - key: PBK_PUBLIC_AVA_CHAT_KEY
        sync: false
      - key: PBK_PUBLIC_AVA_CHAT_RATE_LIMIT_MAX
        value: "24"
      - key: PBK_PUBLIC_AVA_CHAT_RATE_LIMIT_WINDOW_MS
        value: "900000"

      # TOTP is code-ready. Do not set PBK_TOTP_REQUIRED=true until the admin
      # has enrolled PBK_TOTP_SECRET in an authenticator app and verified it.
      - key: PBK_TOTP_SECRET
        sync: false
      - key: PBK_TOTP_REQUIRED
        value: "false"
      - key: PBK_TOTP_WINDOW
        value: "1"

      # ── n8n outbound (bridge fans events to n8n) ────────────────────────
      - key: PBK_N8N_API_BASE_URL
        sync: false
      - key: PBK_N8N_API_KEY
        sync: false
      - key: PBK_N8N_APPROVAL_WEBHOOK
        sync: false
      - key: PBK_N8N_LEAD_WEBHOOK
        sync: false

      # ── Telnyx (voice + messaging) ──────────────────────────────────────
      # Required for live SMS/calls. Without these the bridge falls back to
      # stub behavior (records activity but doesn't actually dial/send).
      - key: PBK_TELNYX_API_KEY
        sync: false
      - key: PBK_TELNYX_FROM_NUMBER
        sync: false
      - key: PBK_TELNYX_CONNECTION_ID
        sync: false
      - key: PBK_TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: PBK_TELNYX_MEDIA_STREAM_TOKEN
        sync: false
      # Optional: override the default webhook URL Telnyx posts call/message
      # events to. Defaults to ${PBK_PUBLIC_BASE_URL}/api/webhooks/telnyx.
      - key: PBK_TELNYX_WEBHOOK_URL
        sync: false

      - key: PBK_DEEPGRAM_API_KEY
        sync: false
      - key: PBK_DEEPGRAM_STREAM_CALLS
        value: "false"
      - key: PBK_DEEPGRAM_STREAM_TRACK
        value: inbound_track
      - key: PBK_DEEPGRAM_STREAM_CODEC
        value: PCMU
      # Browser microphone sends WebM/Opus container chunks. Flux accepts
      # containerized browser audio without raw encoding/sample_rate params.
      - key: PBK_DEEPGRAM_BROWSER_LIVE_MODEL
        value: flux-general-en
      - key: PBK_DEEPGRAM_BROWSER_FALLBACK_MODEL
        value: nova-2

      - key: PBK_INSTANTLY_API_KEY
        sync: false
      - key: PBK_INSTANTLY_DEFAULT_FROM_EMAIL
        sync: false
      - key: PBK_INSTANTLY_BASE_URL
        value: https://api.instantly.ai/api/v2

      - key: PBK_SCRAPLING_MCP_URL
        sync: false

      # Browser Ava voice. Requires a user gesture and the private bridge key
      # saved in dashboard Settings before microphone sessions can start.
      - key: PBK_BROWSER_VOICE_ENABLED
        value: "true"
      - key: PBK_BROWSER_VOICE_SESSION_TTL_MS
        value: "300000"
      - key: PBK_BROWSER_VOICE_ENCODING
        value: opus
      - key: PBK_BROWSER_VOICE_SAMPLE_RATE
        value: "48000"

      # ElevenLabs spoken replies for the Ava avatar.
      - key: PBK_ELEVENLABS_TTS_ENABLED
        value: "true"
      - key: PBK_ELEVENLABS_API_KEY
        sync: false
      - key: PBK_ELEVENLABS_VOICE_ID
        value: 5u41aNhyCU6hXOcjPPv0
      - key: PBK_ELEVENLABS_MODEL_ID
        value: eleven_turbo_v2_5
      - key: PBK_ELEVENLABS_STABILITY
        value: "0.5"
      - key: PBK_ELEVENLABS_SIMILARITY_BOOST
        value: "0.75"
      - key: PBK_ELEVENLABS_SPEED
        value: "0.98"
      # Keep these off for the low-latency turbo phone model unless you move
      # Ava to an ElevenLabs model that explicitly supports audio tags/SSML.
      - key: PBK_ELEVENLABS_AUDIO_TAGS_ENABLED
        value: "false"
      - key: PBK_ELEVENLABS_SSML_ENABLED
        value: "false"

      # Closed-loop Command Center activation. These switches let Rex analyze
      # Ava calls, align daily to the $1M/month target, and auto-apply only
      # safe learning/prosody/script recommendations. Provider writes, offers,
      # contracts, campaigns, admin actions, calls, SMS, and email stay
      # approval-gated by the bridge guardrails unless explicitly unlocked.
      - key: PBK_COMMAND_CENTER_CLOSED_LOOP_ENABLED
        value: "true"
      - key: PBK_AUTOPILOT_LOW_RISK
        value: "true"
      - key: PBK_REVENUE_TARGET_MONTHLY
        value: "1000000"
      - key: PBK_REX_GOAL_ALIGNMENT_INTERVAL_MS
        value: "86400000"
      - key: PBK_CALL_ANALYZER_INTERVAL_MS
        value: "3600000"
      - key: PBK_PROSODY_TRAIN_INTERVAL_MS
        value: "604800000"
      - key: PBK_AVA_CALL_INTELLIGENCE_ENABLED
        value: "true"
      - key: PBK_AVA_CALL_INTELLIGENCE_STRATEGIST_MODE
        value: inline
      - key: PBK_AVA_CALL_INTELLIGENCE_TIMEOUT_MS
        value: "1200"

      # Protected operator controls. Used for kill-switch restore/activation and
      # Ava-to-operator urgent calls. Do not commit the passcode value here.
      # Team passcode lets staff unlock routine approval actions without admin
      # privileges. Set this to the shared team code in Render's private env UI.
      - key: PBK_TEAM_PASSCODE
        sync: false
      - key: PBK_TEAM_SESSION_TTL_MS
        value: "43200000"
      - key: PBK_TEAM_APPROVAL_LIMIT
        value: "150000"
      - key: PBK_PROTECTED_OPS_PASSCODE
        sync: false
      - key: PBK_OPERATOR_PHONE
        sync: false
      - key: PBK_SLACK_UPDATES_CHANNEL_ID
        sync: false

      # ── DocuSign (JWT auth + envelope create) ───────────────────────────
      # Provision: DocuSign developer account -> create Service Integration ->
      # generate RSA keypair -> upload public key -> grant impersonation
      # consent for the user. https://developers.docusign.com/platform/auth/jwt/
      - key: PBK_DOCUSIGN_INTEGRATION_KEY
        sync: false
      - key: PBK_DOCUSIGN_USER_ID
        sync: false
      - key: PBK_DOCUSIGN_ACCOUNT_ID
        sync: false
      # Auth host. Use 'account-d.docusign.com' for dev/sandbox, 'account.docusign.com' for prod.
      - key: PBK_DOCUSIGN_AUTH_HOST
        value: account.docusign.com
      # REST base URL. 'https://demo.docusign.net/restapi' for dev, 'https://www.docusign.net/restapi' for prod.
      - key: PBK_DOCUSIGN_REST_BASE
        value: https://www.docusign.net/restapi
      # The full PEM-formatted RSA private key. Multi-line; paste exactly,
      # including the BEGIN/END markers. Render's env var UI handles newlines.
      - key: PBK_DOCUSIGN_PRIVATE_KEY
        sync: false

      # ── BatchData skip-trace ────────────────────────────────────────────
      - key: PBK_BATCHDATA_API_KEY
        sync: false
      # Optional: override base URL for BatchData (e.g. staging environments).
      - key: PBK_BATCHDATA_BASE_URL
        value: https://api.batchdata.com

      # ── Slack incoming webhook (direct from bridge) ─────────────────────
      # Channel is determined by the URL when the webhook is created in Slack.
      - key: PBK_SLACK_WEBHOOK_URL
        sync: false

  - type: worker
    name: pbk-event-worker
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: npm run events:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: PBK_REDIS_URL
        fromService:
          type: keyvalue
          name: pbk-openclaw-redis
          property: connectionString
      - key: PBK_REDIS_NAMESPACE
        value: pbk-openclaw
      - key: PBK_EVENT_STREAM_NAME
        value: pbk:events
      - key: PBK_EVENT_CONSUMER_GROUP
        value: pbk-consumers
      - key: PBK_EVENT_WORKER_BATCH_SIZE
        value: "10"
      - key: PBK_EVENT_WORKER_BLOCK_MS
        value: "5000"
      - key: PBK_DATABASE_URL
        sync: false
      - key: PBK_PUBLIC_BASE_URL
        value: https://pbk-openclaw-bridge.onrender.com
      - key: PBK_EVENT_WORKER_BRIDGE_URL
        value: https://pbk-openclaw-bridge.onrender.com
      - key: PBK_BRIDGE_API_KEY
        sync: false
      - key: PBK_OBSERVABILITY_ENABLED
        value: "true"
      - key: PBK_OBSERVABILITY_SERVICE_NAME
        value: pbk-event-worker
      - key: OTEL_SERVICE_NAME
        value: pbk-event-worker
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: PBK_OBSERVABILITY_ALERTS_ENABLED
        value: "true"
      - key: PBK_OBSERVABILITY_SLACK_WEBHOOK_URL
        sync: false

  - type: worker
    name: pbk-coworker-heartbeat
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: npm run coworker:heartbeat:loop
    envVars:
      - key: NODE_ENV
        value: production
      - key: PBK_HEARTBEAT_BRIDGE_URL
        value: https://pbk-openclaw-bridge.onrender.com
      - key: PBK_PUBLIC_BASE_URL
        value: https://pbk-openclaw-bridge.onrender.com
      - key: PBK_BRIDGE_API_KEY
        sync: false
      - key: PBK_COWORKER_HEARTBEAT_INTERVAL_MS
        value: "21600000"
      - key: PBK_OBSERVABILITY_ENABLED
        value: "true"
      - key: PBK_OBSERVABILITY_SERVICE_NAME
        value: pbk-coworker-heartbeat
      - key: OTEL_SERVICE_NAME
        value: pbk-coworker-heartbeat
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: PBK_OBSERVABILITY_ALERTS_ENABLED
        value: "true"
      - key: PBK_OBSERVABILITY_SLACK_WEBHOOK_URL
        sync: false
